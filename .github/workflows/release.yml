name: release

# npm's trusted publisher names this file; the release and publish jobs must stay in it.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to republish (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true') }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: jdx/mise-action@v4
        with:
          cache: true

      # No registry-url: setup-node's placeholder _authToken blocks the OIDC fallback.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Publish to npm
        run: npm publish --provenance --access public

      # A green publish is not proof; poll the registry.
      - name: Verify the version reached the registry
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          URL="https://registry.npmjs.org/$NAME/$VERSION"
          for i in $(seq 1 30); do
            if [ "$(curl -fsS -o /dev/null -w '%{http_code}' "$URL" || true)" = "200" ]; then
              echo "Confirmed $NAME@$VERSION after $((i * 10))s."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$NAME@$VERSION is not on the registry after 5 minutes."
          exit 1
