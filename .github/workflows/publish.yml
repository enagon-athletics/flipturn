name: publish

# Registered on npmjs.com as the trusted publisher; renaming this file breaks publishing.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (defaults to the triggering ref)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to check out (branch, tag, or SHA)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: jdx/mise-action@v4
        with:
          cache: true

      # No registry-url: setup-node's placeholder _authToken blocks the OIDC fallback.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      # --provenance forces the OIDC exchange, which auto-detection skips under workflow_call.
      - name: Publish to npm
        run: npm publish --provenance --access public

      # A green publish is not proof; poll the registry.
      - name: Verify the version reached the registry
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          URL="https://registry.npmjs.org/$NAME/$VERSION"
          echo "Waiting for $NAME@$VERSION"
          for i in $(seq 1 30); do
            CODE=$(curl -fsS -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "Confirmed after $((i * 10))s."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$NAME@$VERSION is not on the registry after 5 minutes, but the publish step reported success."
          exit 1
